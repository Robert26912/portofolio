<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self'; 
                   style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; 
                   font-src 'self' https://fonts.gstatic.com; 
                   img-src 'self' data:; 
                   connect-src 'self';">

    <!-- SEO Meta -->
    <meta name="description" content="Robert Hidri's project dashboard — explore IoT, Python, embedded systems, and dev tools modules.">
    <meta name="author" content="Robert Hidri">
    <title>Dashboard — Robert Hidri</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <!-- Accessibility: Skip to main content -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header class="dashboard-header" role="banner">
        <div class="header-content">
            <a href="index.html" class="header-back" aria-label="Back to home page">← Home</a>
            <h1>Project Dashboard</h1>
            <div class="header-links">
                <span class="header-tag">Modular · Plugin Architecture</span>
                <a href="architecture.html" class="header-link">🏗️ View Architecture</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main" id="main-content">

        <!-- Search & Filters -->
        <section class="controls" aria-label="Search and filter controls">
            <div class="search-bar">
                <span class="search-icon" aria-hidden="true">🔍</span>
                <input 
                    type="search" 
                    id="searchInput" 
                    placeholder="Search projects, tools, skills..."
                    aria-label="Search projects"
                    autocomplete="off"
                >
            </div>
            <div class="filters" role="group" aria-label="Category filters">
                <button class="filter-btn active" data-category="all" aria-pressed="true">All</button>
                <button class="filter-btn" data-category="projects" aria-pressed="false">Projects</button>
                <button class="filter-btn" data-category="tools" aria-pressed="false">Tools</button>
                <button class="filter-btn" data-category="iot" aria-pressed="false">IoT</button>
            </div>
        </section>

        <!-- Tile Grid -->
        <section class="tile-grid" id="tileGrid" aria-label="Project modules" aria-live="polite">
            <div class="loading" role="status">Loading modules...</div>
        </section>

    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon" aria-hidden="true">📦</div>
                <h2 id="modalTitle">Module Title</h2>
                <span class="category-badge" id="modalCategory">category</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
        <p>&copy; 2026 Robert Hidri · Built with vanilla JS &amp; plugin architecture</p>
    </footer>

    <!-- Scripts: tools FIRST, then loader -->
    <script src="modules/dev-tools/tools.js" defer></script>
    <script src="module-loader.js" defer></script>
</body>
</html>
