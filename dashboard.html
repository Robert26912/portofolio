<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    
    <!-- Responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Dashboard - My Portfolio</title>
    
    <!-- Link to your existing CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Link to new dashboard CSS (we'll create this next) -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- Header with navigation -->
    <header class="dashboard-header">
        <div class="header-content">
            <!-- Logo/Name -->
            <div class="logo">
                <a href="index.html">← Back to Home</a>
            </div>
            
            <!-- Page title -->
            <h1>Project Dashboard</h1>
        </div>
    </header>

    <!-- Main content area -->
    <main class="dashboard-main">
        
        <!-- Introduction -->
        <section class="dashboard-intro">
            <p class="subtitle">
                Explore my projects organized by technology and category. 
                Click any tile to see details.
            </p>
        </section>

        <!-- Search bar -->
        <section class="controls">
            <div class="search-bar">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search projects..."
                    aria-label="Search projects"
                >
            </div>
            
            <!-- Category filters -->
            <div class="filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="projects">Projects</button>
                <button class="filter-btn" data-category="tools">Tools</button>
                <button class="filter-btn" data-category="iot">IoT</button>
            </div>
        </section>
        <!-- Tile Grid - Module loader will fill this -->
        <section class="tile-grid" id="tileGrid">
            <!-- JavaScript will insert tiles here -->
            <div class="loading">Loading modules...</div>
        </section>

    </main>

<!-- Modal for showing module details -->
    <div id="detailModal" class="modal">
        <!-- Dark backdrop -->
        <div class="modal-backdrop"></div>
        
        <!-- Modal content box -->
        <div class="modal-content">
            <!-- Close button -->
            <button class="modal-close" id="modalClose">&times;</button>
            
            <!-- Modal header -->
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">📦</div>
                <h2 id="modalTitle">Module Title</h2>
                <span class="category-badge" id="modalCategory">category</span>
            </div>
            
            <!-- Modal body - content goes here -->
            <div class="modal-body" id="modalBody">
                <!-- JavaScript will fill this -->
            </div>
            
            <!-- Modal footer -->
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>
<!-- Load developer tools -->
    <script src="modules/dev-tools/tools.js"></script>
    
    <!-- Load the module loader script -->
    <script src="module-loader.js"></script>
    
    <!-- Load the module loader script -->
    <script src="module-loader.js"></script>

</body>
</html>
