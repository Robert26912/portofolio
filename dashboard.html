<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Robert Hidri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="header-content">
            <a href="index.html" class="header-back">← Home</a>
            <h1>Project Dashboard</h1>
            <span class="header-tag">Modular · Plugin Architecture</span>
        </div>
    </header>

    <!-- Main -->
    <main class="dashboard-main">

        <!-- Controls -->
        <section class="controls">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search projects, tools, skills..."
                    aria-label="Search projects"
                >
            </div>
            <div class="filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="projects">Projects</button>
                <button class="filter-btn" data-category="tools">Tools</button>
                <button class="filter-btn" data-category="iot">IoT</button>
            </div>
        </section>

        <!-- Tile Grid -->
        <section class="tile-grid" id="tileGrid">
            <div class="loading">Loading modules...</div>
        </section>

    </main>

    <!-- Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">📦</div>
                <h2 id="modalTitle">Module Title</h2>
                <span class="category-badge" id="modalCategory">category</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCloseBtn">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Robert Hidri · Built with vanilla JS & plugin architecture</p>
    </footer>

    <!-- Scripts: tools FIRST, then loader. Only loaded ONCE each. -->
    <script src="modules/dev-tools/tools.js"></script>
    <script src="module-loader.js"></script>

</body>
</html>
